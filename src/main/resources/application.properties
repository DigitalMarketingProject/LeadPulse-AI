spring.application.name=marketingleadscoring

server.port=8080

# Use H2 in-memory database by default so the app runs without a local MySQL install.
# For production, set DB_URL, DB_USERNAME, DB_PASSWORD, and DB_DRIVER.
spring.datasource.url=${DB_URL:jdbc:h2:mem:marketinglead_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.thymeleaf.cache=false

# Optional H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Used only to protect local organization provisioning. Replace in deployment secrets.
leadpulse.bootstrap-key=${LEADPULSE_BOOTSTRAP_KEY:local-development-bootstrap-key}

# Anonymous tracking safety limit; do not accept oversized event payloads.
server.max-http-request-header-size=8KB
leadpulse.rate-limit.requests=120
leadpulse.rate-limit.window-seconds=60
